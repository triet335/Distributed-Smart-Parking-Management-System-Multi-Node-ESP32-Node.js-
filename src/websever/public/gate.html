<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bảng Điện Tử Cổng Bãi Xe - Smart Parking</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0f172a;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 30px 20px;
      text-align: center;
    }
    .header {
      width: 100%;
      max-width: 900px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid #334155;
      padding-bottom: 16px;
    }
    .logo { font-size: 24px; font-weight: 800; color: #38bdf8; display: flex; align-items: center; gap: 10px; }
    .clock { font-size: 24px; font-family: monospace; font-weight: 700; color: #94a3b8; }

    .main-display {
      width: 100%;
      max-width: 900px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
      margin: auto 0;
    }

    .kpi-box {
      background: #1e293b;
      border: 3px solid #38bdf8;
      border-radius: 20px;
      padding: 30px;
      width: 100%;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }
    .kpi-title { font-size: 26px; font-weight: 700; text-transform: uppercase; color: #94a3b8; letter-spacing: 2px; }
    .kpi-num {
      font-size: 96px;
      font-weight: 900;
      line-height: 1.1;
      margin: 10px 0;
      color: #4ade80;
      text-shadow: 0 0 20px rgba(74, 222, 128, 0.4);
    }
    .kpi-num.full { color: #f87171; text-shadow: 0 0 20px rgba(248, 113, 113, 0.4); }

    .zones-sub {
      display: flex;
      justify-content: center;
      gap: 30px;
      margin-top: 15px;
      font-size: 22px;
      font-weight: 600;
    }
    .zone-pill {
      background: #0f172a;
      padding: 8px 24px;
      border-radius: 30px;
      border: 1px solid #475569;
    }

    .instruction-card {
      width: 100%;
      background: #1e293b;
      border-radius: 16px;
      padding: 24px;
      border: 2px dashed #475569;
      min-height: 140px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      transition: all 0.3s;
    }
    .instruction-text {
      font-size: 32px;
      font-weight: 800;
      letter-spacing: 1px;
    }
    .instruction-sub {
      font-size: 18px;
      color: #94a3b8;
      margin-top: 6px;
    }

    .status-in { background: #064e3b; border-color: #059669; color: #34d399; }
    .status-out { background: #1e3a8a; border-color: #2563eb; color: #60a5fa; }
    .status-reject { background: #7f1d1d; border-color: #dc2626; color: #f87171; }

    .footer {
      font-size: 15px;
      color: #64748b;
      width: 100%;
      max-width: 900px;
      display: flex;
      justify-content: space-between;
      border-top: 1px solid #334155;
      padding-top: 14px;
    }
  </style>
</head>
<body>

  <header class="header">
    <div class="logo">🅿️ BÃI ĐỖ XE THÔNG MINH CTU</div>
    <div class="clock" id="clockText">--:--:--</div>
  </header>

  <main class="main-display">
    <div class="kpi-box">
      <div class="kpi-title">CHỖ ĐỖ CÒN TRỐNG</div>
      <div class="kpi-num" id="freeNumber">--</div>
      <div class="zones-sub">
        <div class="zone-pill" id="zoneAText">Khu A: --</div>
        <div class="zone-pill" id="zoneBText">Khu B: --</div>
      </div>
    </div>

    <div class="instruction-card" id="instructionBox">
      <div class="instruction-text" id="instructionText">VUI LÒNG QUẸT THẺ TẠI ĐẦU ĐỌC</div>
      <div class="instruction-sub" id="instructionSub">Hệ thống mở Barie tự động</div>
    </div>
  </main>

  <footer class="footer">
    <div>Trạng thái Barie: <strong id="gateBarieStatus" style="color:#f87171">ĐÓNG</strong></div>
    <div>Lập trình mạng (KC321) — TS. Nguyễn Văn Khanh</div>
  </footer>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();

    function updateClock() {
      document.getElementById('clockText').textContent = new Date().toLocaleTimeString('vi-VN');
    }
    setInterval(updateClock, 1000);
    updateClock();

    socket.on('connect', () => {
      socket.emit('register_web');
    });

    socket.on('snapshot', (data) => {
      if (!data || !data.summary) return;
      const s = data.summary;
      const devs = new Map(data.devices.map(d => [d.id, d]));

      const numEl = document.getElementById('freeNumber');
      numEl.textContent = `${s.free} / ${s.totalSlots}`;
      if (s.free === 0) {
        numEl.classList.add('full');
      } else {
        numEl.classList.remove('full');
      }

      const zoneA = devs.get('ESP_ZONE_A');
      const zoneB = devs.get('ESP_ZONE_B');
      const freeA = zoneA && zoneA.slots ? zoneA.slots.filter(x => x === 0).length : '--';
      const freeB = zoneB && zoneB.slots ? zoneB.slots.filter(x => x === 0).length : '--';

      document.getElementById('zoneAText').textContent = `Khu A: Còn ${freeA} chỗ`;
      document.getElementById('zoneBText').textContent = `Khu B: Còn ${freeB} chỗ`;

      const gate = devs.get('ESP_GATE');
      const box = document.getElementById('instructionBox');
      const text = document.getElementById('instructionText');
      const sub = document.getElementById('instructionSub');
      const barieStatus = document.getElementById('gateBarieStatus');

      if (gate) {
        const isOpened = gate.barieState === 'opened' || gate.barieState === 'emergency_open';
        barieStatus.textContent = isOpened ? 'ĐANG MỞ (90°)' : 'ĐANG ĐÓNG (0°)';
        barieStatus.style.color = isOpened ? '#34d399' : '#f87171';

        if (gate.lastAction === 'IN') {
          box.className = 'instruction-card status-in';
          text.textContent = 'XIN MỜI XE VÀO';
          sub.textContent = `Thẻ [${gate.lastUid}] hợp lệ • Barie đang mở`;
        } else if (gate.lastAction === 'OUT') {
          box.className = 'instruction-card status-out';
          text.textContent = 'XIN MỜI XE RA • HẸN GẶP LẠI';
          sub.textContent = `Thẻ [${gate.lastUid}] • Cảm ơn quý khách`;
        } else if (gate.lastAction === 'FULL_REJECT') {
          box.className = 'instruction-card status-reject';
          text.textContent = 'BÃI XE ĐÃ ĐẦY';
          sub.textContent = 'Vui lòng quay đầu hoặc chờ lượt tiếp theo';
        } else if (gate.lastAction === 'REJECT') {
          box.className = 'instruction-card status-reject';
          text.textContent = 'THẺ KHÔNG HỢP LỆ';
          sub.textContent = 'Thẻ chưa được đăng ký trong hệ thống';
        }
      }
    });
  </script>
</body>
</html>
